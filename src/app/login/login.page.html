<ion-header class="ion-no-border">
    <ion-toolbar color="primary">
        <ion-title>
            Efetuar Login
        </ion-title>
    </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
    <div class="input-group section">
        <ion-label>Username</ion-label>
        <ion-input [(ngModel)]="username" class="text-input section" type="username" fill="outline" placeholder="Insira seu username"></ion-input>
    </div>
    <div class="input-group section">
        <ion-label>Password</ion-label>
        <ion-input [(ngModel)]="password" class="text-input section" type="password" fill="outline" placeholder="Insira sua password"></ion-input>
    </div>

    <ion-button expand="block" class="ion-margin-top" color="secondary" (click)="login()">Login</ion-button>
    <ion-button expand="block" fill="clear" routerLink="/criar-conta">Criar nova conta</ion-button>

    <!-- Somente para o desenvolvimento, remover na aplicação final -->
    <div>
        <ion-button expand="block" class="botao-vermelho" (click)="clearData()">Excluir todos os dados</ion-button>
    </div>
</ion-content>
