<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title style="font-weight: bold; font-size: 24px;">
      <ion-icon name="compass" style="vertical-align: middle; margin-right: 8px;"></ion-icon>
      Descobrir
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-searchbar 
    placeholder="Pesquisar por título ou autor..." 
    (ionInput)="filtrarLivros($event)"
    style="--background: #ffffff; --border-radius: 12px; margin-bottom: 15px; --icon-color: #805d68;">
  </ion-searchbar>

  @if (livrosFiltrados.length === 0) {
    <div class="ion-text-center" style="margin-top: 40px; color: #6a5a62;">
      <ion-icon name="search-outline" style="font-size: 48px;"></ion-icon>
      <p>Nenhum livro encontrado com esse nome.</p>
    </div>
  }

  <ion-grid class="ion-no-padding">
    <ion-row>
      @for (livro of livrosFiltrados; track livro.id) {
        <ion-col size="6" class="ion-padding-tiny">
          
          <ion-card style="margin: 5px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: relative;">
            
            <div style="width: 100%; height: 210px; overflow: hidden; background-color: #e0e0e0;">
              <img [src]="livro.capa" [alt]="livro.titulo" style="width: 100%; height: 100%; object-fit: cover;" />
            </div>

            <ion-card-content style="padding: 10px; height: 95px; display: flex; flex-direction: column; justify-content: space-between;">
              <div>
                <h3 style="font-weight: bold; color: #000000; font-size: 14px; margin: 0; line-height: 1.2; max-height: 34px; overflow: hidden;">
                  {{ livro.titulo }}
                </h3>
                <p style="font-size: 12px; color: #666666; margin: 4px 0 0 0;">
                  {{ livro.autor }}
                </p>
              </div>

              <div style="display: flex; justify-content: flex-end; align-items: center; width: 100%;">
                @if (livro.status === 'disponivel') {
                  <ion-button 
                    fill="clear" 
                    size="small" 
                    style="margin: 0; padding: 0; --color: #805d68;"
                    (click)="adicionarAListaDeDesejos(livro.id)">
                    <ion-icon slot="icon-only" name="bookmark-outline" style="font-size: 22px;"></ion-icon>
                  </ion-button>
                } @else if (livro.status === 'quero_ler') {
                  <ion-icon name="bookmark" style="color: #805d68; font-size: 22px; padding-right: 5px;"></ion-icon>
                }
              </div>
            </ion-card-content>

          </ion-card>

        </ion-col>
      }
    </ion-row>
  </ion-grid>

</ion-content>
